<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sprint</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f9fafb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sprint" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    // Script crítico para evitar flash de cor errada no Android/Windows
    (function () {
      const theme = localStorage.getItem('sprint_theme');
      const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#030712');
      } else {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f9fafb');
      }
    })();
  </script>
  <script>
    // Captura precoce do beforeinstallprompt: o bundle (type="module") carrega
    // async, entao o evento pode disparar antes do servico React montar.
    // Aqui apenas guardamos a referencia; toda a logica vive em services/pwa.ts.
    (function () {
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new Event('__pwa-prompt-captured'));
      });
    })();
  </script>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
  <!-- Overlay de atualização: aparece durante o reload do force update -->
  <div id="pwa-update-overlay" style="display:none;position:fixed;inset:0;z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:16px;"></div>
  <script>
    (function () {
      if (sessionStorage.getItem('pwa-force-update') === '1') {
        var dark = localStorage.getItem('sprint_theme') === 'dark' ||
          (!localStorage.getItem('sprint_theme') && window.matchMedia('(prefers-color-scheme:dark)').matches);
        var el = document.getElementById('pwa-update-overlay');
        if (el) {
          el.style.background = dark ? '#030712' : '#f9fafb';
          el.style.display = 'flex';
          el.innerHTML =
            '<div style="width:36px;height:36px;border:3px solid #6366f1;border-top-color:transparent;border-radius:50%;animation:pwa-spin 0.75s linear infinite"></div>' +
            '<span style="font-family:system-ui,-apple-system,sans-serif;font-size:11px;font-weight:700;color:' + (dark ? '#6b7280' : '#9ca3af') + ';letter-spacing:0.1em;text-transform:uppercase">Aplicando atualização...</span>' +
            '<style>@keyframes pwa-spin{to{transform:rotate(360deg)}}</style>';
        }
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
