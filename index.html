<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sprint</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f9fafb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sprint" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    // Script crítico para evitar flash de cor errada no Android/Windows
    (function () {
      const theme = localStorage.getItem('sprint_theme');
      const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#030712');
      } else {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f9fafb');
      }
    })();
  </script>
  <script>
    // Captura sincrona do prompt de instalacao do PWA.
    // Precisa rodar ANTES do bundle (type="module" carrega async),
    // senao o evento beforeinstallprompt dispara e se perde.
    (function () {
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
        console.log('[PWA] beforeinstallprompt capturado');
      });
      window.addEventListener('appinstalled', function () {
        window.deferredPrompt = null;
        try { localStorage.setItem('sprint_app_installed', 'true'); } catch (e) {}
        console.log('[PWA] App instalado');
      });
    })();
  </script>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
