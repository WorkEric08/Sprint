<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sprint</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f9fafb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sprint" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    // Script crítico para evitar flash de cor errada no Android/Windows
    (function () {
      const theme = localStorage.getItem('sprint_theme');
      const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#030712');
      } else {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f9fafb');
      }
    })();
  </script>
  <script>
    // Captura precoce do beforeinstallprompt: o bundle (type="module") carrega
    // async, entao o evento pode disparar antes do servico React montar.
    // Aqui apenas guardamos a referencia; toda a logica vive em services/pwa.ts.
    (function () {
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new Event('__pwa-prompt-captured'));
      });
    })();
  </script>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
